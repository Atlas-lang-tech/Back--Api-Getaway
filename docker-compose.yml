services:
  # =========================
  # TRAEFIK API GATEWAY
  # =========================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.network=back--api-getaway_backend'
      - '--entrypoints.web.address=:80'
    ports:
      - '80:80'
      - '8081:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend
    labels:
      # --- CORS middleware ---
      - 'traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=http://localhost:5173'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowheaders=Content-Type,Authorization'
      - 'traefik.http.middlewares.cors.headers.accesscontrolexposeheaders=Set-Cookie'
      - 'traefik.http.middlewares.cors.headers.accesscontrolmaxage=3600'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowcredentials=true'
      - 'traefik.http.middlewares.cors.headers.addvaryheader=true'

      # --- ForwardAuth middleware (визначений один раз, спільний для всіх сервісів) ---
      - 'traefik.http.middlewares.auth-forward.forwardauth.address=http://auth-service:8080/verify'
      - 'traefik.http.middlewares.auth-forward.forwardauth.trustForwardHeader=true'
      - 'traefik.http.middlewares.auth-forward.forwardauth.authResponseHeaders=X-User-Id,X-User-Role,X-User-Plan,X-User-Email'

  # =========================
  # RABBITMQ (shared atlas.events bus)
  # =========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - backend
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # AUTH SERVICE
  # =========================
  auth-service:
    image: ghcr.io/atlas-lang-tech/back--auth-service:prod
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./env/auth.env
    volumes:
      - ./keys/publicKey.pem:/etc/keys/publicKey.pem:ro
      - ./keys/privateKey.pem:/etc/keys/privateKey.pem:ro
    # Порти відкриті лише для дебагу — в продакшні прибери
    ports:
      - '8080:8080'
      - '9000:9000'
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)'
      - 'traefik.http.routers.auth.entrypoints=web'
      - 'traefik.http.routers.auth.service=auth-svc'
      - 'traefik.http.routers.auth.middlewares=cors'
      - 'traefik.http.services.auth-svc.loadbalancer.server.port=8080'

  # PostgreSQL для auth
  auth-db:
    image: postgres:15
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - '5432:5432'
    networks:
      - backend
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth_user -d auth_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для auth
  auth-redis:
    image: redis:7
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - backend
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # MAIN SERVICE (API)
  # =========================
  main-service:
    image: ghcr.io/atlas-lang-tech/back--main-service:prod
    container_name: main-service
    restart: unless-stopped
    env_file:
      - ./env/main.env
    depends_on:
      main-db:
        condition: service_healthy
      main-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    labels:
      - 'traefik.enable=true'

      # PUBLIC (без авторизації)
      - 'traefik.http.routers.main-public.rule=PathPrefix(`/api/course/public`)'
      - 'traefik.http.routers.main-public.entrypoints=web'
      - 'traefik.http.routers.main-public.service=main-svc'
      - 'traefik.http.routers.main-public.middlewares=cors'
      - 'traefik.http.routers.main-public.priority=5'

      # PRIVATE (з ForwardAuth)
      - 'traefik.http.routers.main-private.rule=PathPrefix(`/api/course/private`)'
      - 'traefik.http.routers.main-private.entrypoints=web'
      # ВАЖЛИВО: cors завжди першим, потім auth-forward
      - 'traefik.http.routers.main-private.middlewares=cors,auth-forward'
      - 'traefik.http.routers.main-private.service=main-svc'
      - 'traefik.http.routers.main-private.priority=10'

      # SERVICE PORT
      - 'traefik.http.services.main-svc.loadbalancer.server.port=3000'

  # PostgreSQL для main
  main-db:
    image: postgres:15
    container_name: main-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: main_user
      POSTGRES_PASSWORD: main_pass
    ports:
      - '5433:5432'
    networks:
      - backend
    volumes:
      - main-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U main_user -d main_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для main
  main-redis:
    image: redis:7
    container_name: main-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    networks:
      - backend
    volumes:
      - main-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # VOCABULARY SERVICE (API)
  # =========================
  vocabulary-service:
    image: ghcr.io/atlas-lang-tech/back--vocabulary-service:prod
    container_name: vocabulary-service
    restart: unless-stopped
    env_file:
      - ./env/vocabulary.env
    depends_on:
      vocabulary-db:
        condition: service_healthy
      vocabulary-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    labels:
      - 'traefik.enable=true'

      # PUBLIC (без авторизації)
      - 'traefik.http.routers.vocabulary-public.rule=PathPrefix(`/api/vocabulary/public`)'
      - 'traefik.http.routers.vocabulary-public.entrypoints=web'
      - 'traefik.http.routers.vocabulary-public.service=vocabulary-svc'
      - 'traefik.http.routers.vocabulary-public.middlewares=cors'
      - 'traefik.http.routers.vocabulary-public.priority=5'

      # PRIVATE (з ForwardAuth)
      - 'traefik.http.routers.vocabulary-private.rule=PathPrefix(`/api/vocabulary/private`)'
      - 'traefik.http.routers.vocabulary-private.entrypoints=web'
      # ВАЖЛИВО: cors завжди першим, потім auth-forward
      - 'traefik.http.routers.vocabulary-private.middlewares=cors,auth-forward'
      - 'traefik.http.routers.vocabulary-private.service=vocabulary-svc'
      - 'traefik.http.routers.vocabulary-private.priority=10'

      # SERVICE PORT
      - 'traefik.http.services.vocabulary-svc.loadbalancer.server.port=3000'

  # PostgreSQL для vocabulary
  vocabulary-db:
    image: postgres:15
    container_name: vocabulary-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vocabulary_db
      POSTGRES_USER: vocabulary_user
      POSTGRES_PASSWORD: vocabulary_pass
    ports:
      - '5434:5432'
    networks:
      - backend
    volumes:
      - vocabulary-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vocabulary_user -d vocabulary_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для vocabulary
  vocabulary-redis:
    image: redis:7
    container_name: vocabulary-redis
    restart: unless-stopped
    ports:
      - '6381:6379'
    networks:
      - backend
    volumes:
      - vocabulary-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # BILLING SERVICE (API)
  # =========================
  billing-service:
    image: ghcr.io/atlas-lang-tech/back--billing-service:prod
    container_name: billing-service
    restart: unless-stopped
    env_file:
      - ./env/billing.env
    depends_on:
      billing-db:
        condition: service_healthy
      billing-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    labels:
      - 'traefik.enable=true'

      # PUBLIC (без авторизації)
      - 'traefik.http.routers.billing-public.rule=PathPrefix(`/api/billing/public`)'
      - 'traefik.http.routers.billing-public.entrypoints=web'
      - 'traefik.http.routers.billing-public.service=billing-svc'
      - 'traefik.http.routers.billing-public.middlewares=cors'
      - 'traefik.http.routers.billing-public.priority=5'

      # DOCS (Swagger, dev) — без авторизації
      - 'traefik.http.routers.billing-docs.rule=PathPrefix(`/api/billing/docs`)'
      - 'traefik.http.routers.billing-docs.entrypoints=web'
      - 'traefik.http.routers.billing-docs.service=billing-svc'
      - 'traefik.http.routers.billing-docs.middlewares=cors'
      - 'traefik.http.routers.billing-docs.priority=8'

      # PRIVATE (з ForwardAuth)
      - 'traefik.http.routers.billing-private.rule=PathPrefix(`/api/billing/private`)'
      - 'traefik.http.routers.billing-private.entrypoints=web'
      # ВАЖЛИВО: cors завжди першим, потім auth-forward
      - 'traefik.http.routers.billing-private.middlewares=cors,auth-forward'
      - 'traefik.http.routers.billing-private.service=billing-svc'
      - 'traefik.http.routers.billing-private.priority=10'

      # SERVICE PORT
      - 'traefik.http.services.billing-svc.loadbalancer.server.port=3000'

  # PostgreSQL для billing
  billing-db:
    image: postgres:15
    container_name: billing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_pass
    ports:
      - '5435:5432'
    networks:
      - backend
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billing_user -d billing_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для billing
  billing-redis:
    image: redis:7
    container_name: billing-redis
    restart: unless-stopped
    ports:
      - '6382:6379'
    networks:
      - backend
    volumes:
      - billing-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # MAIL SERVICE (event-driven, без публічних REST-роутів)
  # =========================
  # Сервіс споживає події з atlas.events і шле листи через Resend.
  # Зовнішніх ендпоінтів немає (лише GET /api/mail/health), тому Traefik-роутери
  # та auth-forward йому не потрібні — достатньо бути в мережі backend.
  mail-service:
    image: ghcr.io/atlas-lang-tech/back--mail-service:prod
    container_name: mail-service
    restart: unless-stopped
    env_file:
      - ./env/mail.env
    depends_on:
      mail-db:
        condition: service_healthy
      mail-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  # PostgreSQL для mail (аудит відправлень — таблиця mail_logs)
  mail-db:
    image: postgres:15
    container_name: mail-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mail_db
      POSTGRES_USER: mail_user
      POSTGRES_PASSWORD: mail_pass
    ports:
      - '5436:5432'
    networks:
      - backend
    volumes:
      - mail-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mail_user -d mail_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis для mail (ідемпотентність eventId + BullMQ-черга)
  mail-redis:
    image: redis:7
    container_name: mail-redis
    restart: unless-stopped
    ports:
      - '6383:6379'
    networks:
      - backend
    volumes:
      - mail-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

# =========================
# VOLUMES
# =========================
volumes:
  auth-db-data:
  auth-redis-data:
  main-db-data:
  main-redis-data:
  vocabulary-db-data:
  vocabulary-redis-data:
  billing-db-data:
  billing-redis-data:
  mail-db-data:
  mail-redis-data:
  rabbitmq-data:

# =========================
# NETWORKS
# =========================
networks:
  backend:
    driver: bridge
