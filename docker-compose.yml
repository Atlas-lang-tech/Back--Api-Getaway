services:
  # =========================
  # TRAEFIK API GATEWAY
  # =========================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080" # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

  # =========================
  # AUTH SERVICE
  # =========================
  auth-service:
    image: ghcr.io/atlas-lang-tech/back--auth-service:sha-1bfc0ab
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./env/auth.env
    volumes:
      - ./keys/publicKey.pem:/etc/keys/publicKey.pem:ro
      - ./keys/privateKey.pem:/etc/keys/privateKey.pem:ro
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      - auth-db
      - auth-redis
      - kafka
    networks:
      - backend

  # PostgreSQL для auth
  auth-db:
    image: postgres:15
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    networks:
      - backend
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  # Redis для auth
  auth-redis:
    image: redis:7
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend
    volumes:
      - auth-redis-data:/data

  # =========================
  # KAFKA
  # =========================
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - backend

  kafka:
    image: bitnami/kafka:3.5
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - backend

  # =========================
  # MAIN SERVICE (API)
  # =========================
  main-service:
    image: ghcr.io/atlas-lang-tech/back--main-service:sha-089df0f
    container_name: main-service
    restart: unless-stopped
    env_file:
      - ./env/main.env
    depends_on:
      - main-db
      - main-redis
    networks:
      - backend

    labels:
      - "traefik.enable=true"

      # =========================
      # STRIP PREFIX
      # =========================
      - "traefik.http.middlewares.main-strip.stripprefix.prefixes=/api/course"

      # =========================
      # PUBLIC
      # =========================
      - "traefik.http.routers.main-public.rule=PathPrefix(`/api/course/public`)"
      - "traefik.http.routers.main-public.entrypoints=web"
      - "traefik.http.routers.main-public.middlewares=main-strip"
      - "traefik.http.routers.main-public.service=main-service"
      - "traefik.http.routers.main-public.priority=5"

      # =========================
      # PRIVATE (с auth)
      # =========================
      - "traefik.http.routers.main-private.rule=PathPrefix(`/api/course/private`)"
      - "traefik.http.routers.main-private.entrypoints=web"
      - "traefik.http.routers.main-private.middlewares=main-strip,auth"
      - "traefik.http.routers.main-private.service=main-service"
      - "traefik.http.routers.main-private.priority=10"

      # =========================
      # FORWARDAUTH
      # =========================
      - "traefik.http.middlewares.auth.forwardauth.address=http://auth-service:8080/verify"
      - "traefik.http.middlewares.auth.forwardauth.trustForwardHeader=true"

      # =========================
      # SERVICE PORT
      # =========================
      - "traefik.http.services.main-service.loadbalancer.server.port=3000"
  # PostgreSQL для main
  main-db:
    image: postgres:15
    container_name: main-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: main_user
      POSTGRES_PASSWORD: main_pass
    ports:
      - "5433:5432"
    networks:
      - backend
    volumes:
      - main-db-data:/var/lib/postgresql/data

  # Redis для main
  main-redis:
    image: redis:7
    container_name: main-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - backend
    volumes:
      - main-redis-data:/data

# =========================
# VOLUMES
# =========================
volumes:
  auth-db-data:
  auth-redis-data:
  main-db-data:
  main-redis-data:

# =========================
# NETWORKS
# =========================
networks:
  backend:
    driver: bridge
