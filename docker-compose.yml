services:
  # =========================
  # TRAEFIK API GATEWAY
  # =========================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.network=back--api-getaway_backend'
      - '--entrypoints.web.address=:80'
    ports:
      - '80:80'
      - '8081:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend
    labels:
      # --- CORS middleware ---
      - 'traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=http://localhost:5173'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS,PATCH'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowheaders=Content-Type,Authorization'
      - 'traefik.http.middlewares.cors.headers.accesscontrolexposeheaders=Set-Cookie'
      - 'traefik.http.middlewares.cors.headers.accesscontrolmaxage=3600'
      - 'traefik.http.middlewares.cors.headers.accesscontrolallowcredentials=true'
      - 'traefik.http.middlewares.cors.headers.addvaryheader=true'

  # =========================
  # AUTH SERVICE
  # =========================
  auth-service:
    image: ghcr.io/atlas-lang-tech/back--auth-service:prod
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./env/auth.env
    volumes:
      - ./keys/publicKey.pem:/etc/keys/publicKey.pem:ro
      - ./keys/privateKey.pem:/etc/keys/privateKey.pem:ro
    # Порти відкриті лише для дебагу — в продакшні прибери
    ports:
      - '8080:8080'
      - '9000:9000'
    depends_on:
      - auth-db
      - auth-redis
    networks:
      - backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.auth.rule=PathPrefix(`/api/auth`)'
      - 'traefik.http.routers.auth.entrypoints=web'
      - 'traefik.http.routers.auth.service=auth-svc'
      - 'traefik.http.routers.auth.middlewares=cors'
      - 'traefik.http.services.auth-svc.loadbalancer.server.port=8080'

  # PostgreSQL для auth
  auth-db:
    image: postgres:15
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - '5432:5432'
    networks:
      - backend
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  # Redis для auth
  auth-redis:
    image: redis:7
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - backend
    volumes:
      - auth-redis-data:/data

  # =========================
  # MAIN SERVICE (API)
  # =========================
  main-service:
    image: ghcr.io/atlas-lang-tech/back--main-service:prod
    container_name: main-service
    restart: unless-stopped
    env_file:
      - ./env/main.env
    depends_on:
      - main-db
      - main-redis
    networks:
      - backend
    labels:
      - 'traefik.enable=true'

      # PUBLIC (без авторизації)
      - 'traefik.http.routers.main-public.rule=PathPrefix(`/api/course/public`)'
      - 'traefik.http.routers.main-public.entrypoints=web'
      - 'traefik.http.routers.main-public.service=main-svc'
      - 'traefik.http.routers.main-public.middlewares=cors'
      - 'traefik.http.routers.main-public.priority=5'

      # PRIVATE (з ForwardAuth)
      - 'traefik.http.routers.main-private.rule=PathPrefix(`/api/course/private`)'
      - 'traefik.http.routers.main-private.entrypoints=web'
      # ВАЖЛИВО: cors завжди першим, потім auth-forward
      - 'traefik.http.routers.main-private.middlewares=cors,auth-forward'
      - 'traefik.http.routers.main-private.service=main-svc'
      - 'traefik.http.routers.main-private.priority=10'

      # ForwardAuth middleware — перевірка токену через auth-service
      - 'traefik.http.middlewares.auth-forward.forwardauth.address=http://auth-service:8080/verify'
      - 'traefik.http.middlewares.auth-forward.forwardauth.trustForwardHeader=true'
      # Пробрасуємо заголовки від auth-service до main-service
      - 'traefik.http.middlewares.auth-forward.forwardauth.authResponseHeaders=X-User-Id,X-User-Role'

      # SERVICE PORT
      - 'traefik.http.services.main-svc.loadbalancer.server.port=3000'

  # PostgreSQL для main
  main-db:
    image: postgres:15
    container_name: main-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: main_user
      POSTGRES_PASSWORD: main_pass
    ports:
      - '5433:5432'
    networks:
      - backend
    volumes:
      - main-db-data:/var/lib/postgresql/data

  # Redis для main
  main-redis:
    image: redis:7
    container_name: main-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    networks:
      - backend
    volumes:
      - main-redis-data:/data

# =========================
# VOLUMES
# =========================
volumes:
  auth-db-data:
  auth-redis-data:
  main-db-data:
  main-redis-data:

# =========================
# NETWORKS
# =========================
networks:
  backend:
    driver: bridge
