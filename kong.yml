_format_version: "2.1"
_transform: true

services:
  # =========================
  # 🔐 AUTH SERVICE
  # =========================
  - name: auth-service
    url: http://auth-service:3000 # ← ЗАМЕНИ при необходимости

    routes:
      - name: auth-route
        paths:
          - /api/auth
        strip_path: false

  # =========================
  # 📦 MVP SERVICE
  # =========================
  - name: mvp-service
    url: http://mvp-service:3000 # ← ЗАМЕНИ при необходимости

    routes:
      # =========================
      # 🔓 PUBLIC ENDPOINTS (исключения)
      # =========================

      # GET /api/lesson → публичный
      - name: lesson-public-list
        paths:
          - /api/public
        methods:
          - GET
        strip_path: false

      # =========================
      # 🔒 PRIVATE (ВСЁ ОСТАЛЬНОЕ)
      # =========================

      - name: mvp-private-all
        paths:
          - /api/private
        strip_path: false

        plugins:
          - name: jwt
            config:
              uri_param_names: []
              cookie_names: []
              run_on_preflight: true
              key_claim_name: iss
              secret_is_base64: false

          # (опционально) прокинуть пользователя в сервис
          - name: request-transformer
            config:
              add:
                headers:
                  - "x-user-id:$(jwt.claims.sub)"

# =========================
# 🔑 JWT CONFIG
# =========================
jwt_secrets:
  - consumer: null
    key: https://atlas.org/auth
    algorithm: RS256
    rsa_public_key: |
      -----BEGIN PUBLIC KEY-----
      
      -----END PUBLIC KEY-----
